# Configuração Geral do YouTube View & Watch-Time Bot
target:
  url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
  urls_file: "urls.txt"
  total_views: 10
  continuous: false
  max_runtime_hours: 1.0

execution:
  workers: 2
  min_watch_seconds: 45
  max_watch_seconds: 120
  headless: false
  mute_audio: true
  worker_stagger_delay: 15.0

monitoring:
  poll_interval_seconds: 5.0
  skip_ads: true
  auto_continue: true

stealth:
  enable_anti_fingerprint: true
  enable_micro_interactions: true
  search_and_play: false
  min_delay_between_videos_seconds: 5.0
  max_delay_between_videos_seconds: 15.0

performance:
  block_heavy_media: true
  auto_player_recovery: true

profiles:
  use_persistent_profiles: false
  profiles_dir: "profiles"
  cookies_file: null

logging:
  level: "INFO"
  save_session_logs: true
  logs_dir: "logs"

proxy:
  enabled: false
  file: "proxies.txt"
  low_bandwidth_mode: true
  session_template: null
  quarantine_minutes: 30.0
